name: Release

# Push a tag like v0.2.0 to build, test and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          dotnet publish src/MonitorSwitch.App -c Release -r win-x64 --self-contained true  -p:Version=$v -o out/self-contained
          dotnet publish src/MonitorSwitch.App -c Release -r win-x64 --self-contained false -p:Version=$v -o out/framework-dependent

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/self-contained/MonitorSwitch.exe, README.md -DestinationPath "dist/MonitorSwitch-$v-win-x64.zip"
          Compress-Archive -Path out/framework-dependent/MonitorSwitch.exe, README.md -DestinationPath "dist/MonitorSwitch-$v-win-x64-framework-dependent.zip"
          Get-ChildItem dist/*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/* --title 'MonitorSwitch ${{ github.ref_name }}' --generate-notes
