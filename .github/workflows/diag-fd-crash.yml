name: Diag framework-dependent crash

on:
  push:
    branches: ['diag/**']

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: |
          dotnet publish src/MonitorSwitch.App -c Release -r win-x64 --self-contained true  -o sc
          dotnet publish src/MonitorSwitch.App -c Release -r win-x64 --self-contained false -o fd
      - name: Sequences
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP dumps
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $env:DOTNET_DbgEnableMiniDump = '1'
          $env:DOTNET_DbgMiniDumpType = '4'
          $env:DOTNET_DbgMiniDumpName = "$dumps/ms-%p.dmp"
          function Run($name, $exe) {
            $data = Join-Path $env:RUNNER_TEMP "data-$name-$([guid]::NewGuid().ToString('N'))"
            New-Item -ItemType Directory -Force $data | Out-Null
            '{ "Mode": "ViewOnly" }' | Set-Content (Join-Path $data settings.json)
            $p = Start-Process $exe -ArgumentList '--verbose', '--data-dir', $data -PassThru -RedirectStandardError "$data/stderr.txt"
            Start-Sleep 5
            $state = if ($p.HasExited) { "EXITED 0x{0:X8}" -f $p.ExitCode } else { 'ALIVE' }
            if (-not $p.HasExited) { Stop-Process $p -Force; $p.WaitForExit() }
            "==== $name : $state"
            if ($state -ne 'ALIVE') {
              Get-Content "$data/monitorswitch.log" -ErrorAction SilentlyContinue | Select-Object -First 3
              Get-Content "$data/stderr.txt" -ErrorAction SilentlyContinue
            }
          }
          '--- A: sc then fd (smoke order)'; Run 'A1-sc' sc/MonitorSwitch.exe; Run 'A2-fd' fd/MonitorSwitch.exe
          '--- B: fd then sc';               Run 'B1-fd' fd/MonitorSwitch.exe; Run 'B2-sc' sc/MonitorSwitch.exe
          '--- C: fd then fd';               Run 'C1-fd' fd/MonitorSwitch.exe; Run 'C2-fd' fd/MonitorSwitch.exe
          '--- D: sc then sc';               Run 'D1-sc' sc/MonitorSwitch.exe; Run 'D2-sc' sc/MonitorSwitch.exe
          '--- E: sc, wait 10 s, fd';        Run 'E1-sc' sc/MonitorSwitch.exe; Start-Sleep 10; Run 'E2-fd' fd/MonitorSwitch.exe
          Get-ChildItem $dumps
          $dump = Get-ChildItem $dumps -Filter *.dmp | Select-Object -First 1
          if ($dump) {
            dotnet tool install --global dotnet-dump | Out-Null
            dotnet-dump analyze $dump.FullName -c "pe -nested" -c "clrstack -all" -c "exit"
          }
